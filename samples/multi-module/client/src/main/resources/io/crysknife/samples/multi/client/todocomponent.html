<div data-field="root" style="max-width: 480px; margin: 80px auto; font-family: sans-serif;">
    <h1 style="text-align: center;">Todo List</h1>
    <p style="text-align: center; color: #666;">Multi-module Crysknife sample</p>
    <div style="display: flex; gap: 8px; margin: 24px 0;">
        <input data-field="todoInput" type="text"
               style="flex: 1; padding: 8px 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px;">
        <button data-field="addBtn"
                style="padding: 8px 24px; font-size: 16px; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer;">
            Add
        </button>
    </div>
    <div data-field="todoList"></div>
    <style>
        .todo-item { padding: 10px 0; border-bottom: 1px solid #eee; cursor: pointer; font-size: 16px; }
        .todo-item:hover { background: #f8f8f8; }
        .todo-done { text-decoration: line-through; color: #999; }
    </style>
</div>
