<div data-field="root" style="max-width: 480px; margin: 80px auto; font-family: sans-serif; text-align: center;">
    <h1>Crysknife Hello World</h1>
    <div style="margin: 24px 0;">
        <input data-field="nameInput" type="text"
               style="padding: 8px 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; width: 240px;">
    </div>
    <div style="margin: 16px 0;">
        <button data-field="greetBtn"
                style="padding: 8px 24px; font-size: 16px; background: #0066cc; color: white; border: none; border-radius: 4px; cursor: pointer;">
            Say Hello
        </button>
    </div>
    <div data-field="greeting" style="margin-top: 24px; font-size: 20px; color: #333;"></div>
</div>
