# Keycloak dev services - auto-starts Keycloak container in mvn quarkus:dev
quarkus.keycloak.devservices.realm-path=demo-realm.json
quarkus.keycloak.devservices.realm-name=demo-realm

# OIDC configuration
quarkus.oidc.client-id=demo-client
quarkus.oidc.credentials.secret=demo-secret
quarkus.oidc.application-type=web-app
quarkus.oidc.roles.source=accesstoken
quarkus.oidc.roles.role-claim-path=realm_access/roles

# RP-Initiated Logout — redirects browser to Keycloak to end session there too
quarkus.oidc.logout.path=/api/logout
quarkus.oidc.logout.post-logout-path=/

# /api/login and /api/logout require authentication
quarkus.http.auth.permission.api-auth.paths=/api/login,/api/logout
quarkus.http.auth.permission.api-auth.policy=authenticated

# Everything else is public (SPA static resources, /api/userinfo)
quarkus.http.auth.permission.public.paths=/*
quarkus.http.auth.permission.public.policy=permit
