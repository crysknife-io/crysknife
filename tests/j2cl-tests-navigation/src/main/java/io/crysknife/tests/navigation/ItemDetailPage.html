<div data-field="root" id="item-detail-page">
  <h2 id="item-detail-title">Item Detail (Path Parameter)</h2>
  <p>This page uses @Page(path = "items/{id}/detail") to extract path parameters from the URL.</p>
  <div data-field="paramDisplay" id="param-display"
       style="margin-top: 1rem; padding: 1rem; background: #1d1f21; color: #c5c8c6; border-radius: 4px; font-family: monospace; font-size: 13px; white-space: pre-line; min-height: 60px;">
    No parameters received.
  </div>
  <div style="margin-top: 1rem;">
    <button data-field="backHome" id="item-detail-back-btn">Back to Home</button>
  </div>
</div>
